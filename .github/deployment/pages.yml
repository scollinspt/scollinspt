name: Deploy personal site

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag in scollinspt/scollinspt to publish
        required: false
        default: main
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical site source
        uses: actions/checkout@v4
        with:
          repository: scollinspt/scollinspt
          ref: ${{ inputs.source_ref || 'main' }}
          path: site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
